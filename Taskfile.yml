version: '3'

vars:
  DOCKER_BAKE: touch .env && docker buildx bake -f .env -f docker-bake.hcl
  IMAGE_REF: '{{.IMAGE_REF | default "aseprite:main-headless"}}'

tasks:
  default:
    desc: Display available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: 'Build Aseprite headless image (pass extra bake args after --; e.g. task build -- --no-cache)'
    cmds:
      - '{{.DOCKER_BAKE}} {{.CLI_ARGS}}'

  test:
    desc: Run unit and container smoke tests against built local image
    cmds:
      - task: test:unit
      - task: test:smoke

  test:smoke:
    desc: Run container smoke test against built local image
    cmds:
      - docker run --rm {{.IMAGE_REF}} --version

  test:unit:
    desc: Run unit tests for workflow retention rules, entrypoint behavior, and Dockerfile/CI invariants
    cmds:
      - printf 'FROM ubuntu:26.04\nCOPY --from=ghcr.io/jqlang/jq:1.7.1 /jq /usr/local/bin/jq\n' | docker build -q -t docker-aseprite-headless-test -
      - docker run --rm -v "{{.ROOT_DIR}}:/work:ro" -w /work docker-aseprite-headless-test sh tests/workflow_and_entrypoint_test.sh

  test:pwsh:
    desc: Run PowerShell local CI runner unit and negative-path tests
    cmds:
      - pwsh -NoProfile -File tests/ci_local_test.ps1

  lint:
    desc: Run all static analysis checks (BuildKit check, Hadolint, Actionlint, EditorConfig, ShellCheck)
    deps: [lint:bake, lint:dockerfile, lint:shell, lint:actions, lint:editorconfig]

  lint:bake:
    desc: Validate docker-bake.hcl and Dockerfile via BuildKit check
    cmds:
      - '{{.DOCKER_BAKE}} --call=check'

  lint:dockerfile:
    desc: Lint Dockerfile with Hadolint
    cmds:
      - docker run --rm -i -v "{{.ROOT_DIR}}/.hadolint.yaml:/.hadolint.yaml:ro" hadolint/hadolint < Dockerfile

  lint:shell:
    desc: Lint shell scripts with ShellCheck
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/work:ro" -w /work koalaman/shellcheck:stable entrypoint.sh tests/workflow_and_entrypoint_test.sh

  lint:actions:
    desc: Lint GitHub Actions workflows with Actionlint
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" -w /repo rhysd/actionlint -color

  lint:editorconfig:
    desc: Verify file formatting and line endings against .editorconfig
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/check:ro" mstruebing/editorconfig-checker

  print:
    desc: Print resolved docker-bake.hcl configuration
    cmds:
      - '{{.DOCKER_BAKE}} --print'
