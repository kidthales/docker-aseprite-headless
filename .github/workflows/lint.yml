name: Lint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Run Task Lint
        run: task lint

  notify:
    name: Discord CI Notification
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (#dev-ci-builds)
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Warning: No DISCORD_CI_WEBHOOK configured. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=4388484
            STATUS_ICON="✅"
            TITLE="CI Build Passed: $REPO_NAME"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15088454
            STATUS_ICON="❌"
            TITLE="CI Build Failed: $REPO_NAME"
          else
            COLOR=13202208
            STATUS_ICON="⚠️"
            TITLE="CI Build Cancelled: $REPO_NAME"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          RUN_URL="$SERVER_URL/$REPO_NAME/actions/runs/$RUN_ID"
          COMMIT_URL="$SERVER_URL/$REPO_NAME/commit/$COMMIT_SHA"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          PAYLOAD=$(jq -n \
            --arg title "$STATUS_ICON $TITLE" \
            --argjson color "$COLOR" \
            --arg desc "GitHub Actions workflow completed for branch \`$BRANCH_NAME\`." \
            --arg run_url "$RUN_URL" \
            --arg repo "\`$REPO_NAME\`" \
            --arg branch "\`$BRANCH_NAME\`" \
            --arg actor "@$ACTOR" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg commit "[\`$SHORT_SHA\`]($COMMIT_URL)" \
            --arg run_link "[View Run]($RUN_URL)" \
            --arg ts "$TIMESTAMP" \
            '{
              username: "kidthales CI/CD",
              avatar_url: "https://github.com/kidthales.png",
              embeds: [{
                title: $title,
                color: $color,
                description: $desc,
                url: $run_url,
                author: {
                  name: "kidthales Systems CI",
                  icon_url: "https://github.com/kidthales.png"
                },
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Triggered By", value: $actor, inline: true },
                  { name: "Workflow", value: $workflow, inline: true },
                  { name: "Commit", value: $commit, inline: true },
                  { name: "Run Details", value: $run_link, inline: true }
                ],
                footer: {
                  text: "kidthales Automation • Antigravity",
                  icon_url: "https://github.com/kidthales.png"
                },
                timestamp: $ts
              }]
            }')

          curl -s -S -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" > /dev/null || echo "Warning: Discord webhook dispatch failed."
