name: Lint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - uses: docker/setup-buildx-action@v4
      - name: Run Task Lint
        run: task lint
