name: Batch

on:
  workflow_dispatch: ~
  schedule:
    # UTC: Daily build at 04:20 (main is built nightly; static tags skip via check-tag)
    - cron: 20 4 * * *

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  batch-build-and-push:
    strategy:
      fail-fast: false
      matrix:
        aseprite-git-ref: [v1.3.15.5, v1.3.16.1, v1.3.17.2, v1.3.18.6, main]
    uses: ./.github/workflows/base.yml
    with:
      aseprite-git-ref: ${{ matrix.aseprite-git-ref }}
      aseprite-build-type: Release
      force-rebuild: false
    secrets:
      ghcr-token: ${{ secrets.GITHUB_TOKEN }}
