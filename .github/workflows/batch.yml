name: Batch

on:
  workflow_dispatch:
    inputs:
      aseprite-git-ref:
        description: 'Aseprite git ref to build (e.g. main, v1.3.18.6)'
        required: true
        default: 'main'
        type: string
      aseprite-build-type:
        description: 'Usually one of Debug, Release, or RelWithDebInfo'
        required: false
        default: 'Release'
        type: string
      force-rebuild:
        description: 'Force rebuild even if image already exists in GHCR'
        required: false
        default: false
        type: boolean
  schedule:
    # UTC: Daily build of main nightly branch at 04:20
    - cron: 20 4 * * *

concurrency:
  group: ${{ github.workflow }}-${{ inputs.aseprite-git-ref || 'scheduled' }}
  cancel-in-progress: true

jobs:
  batch-build-and-push:
    uses: ./.github/workflows/base.yml
    with:
      aseprite-git-ref: ${{ inputs.aseprite-git-ref || 'main' }}
      aseprite-build-type: ${{ inputs.aseprite-build-type || 'Release' }}
      force-rebuild: ${{ inputs.force-rebuild || false }}
    secrets:
      ghcr-token: ${{ secrets.GITHUB_TOKEN }}
      dispatch-pat: ${{ secrets.DISPATCH_PAT || secrets.CR_PAT || secrets.GITHUB_TOKEN }}
