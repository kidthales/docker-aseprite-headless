name: Base

on:
  workflow_call: 
    inputs: 
      aseprite-git-ref:
        required: false
        type: string
        description: The desired Aseprite git ref to build from.
        default: main
      aseprite-build-type:
        required: false
        type: string
        description: Usually one of 'Debug', 'Release', or 'RelWithDebInfo'.
        default: Release
      force-rebuild:
        required: false
        type: boolean
        description: Force rebuild even if image tag exists in GHCR.
        default: false

    secrets:
      ghcr-token:
        required: true
        description: Access token to the GitHub Container Registry associated with the repository owner.
      dispatch-pat:
        required: false
        description: Access token to trigger repository_dispatch on downstream repositories.

jobs:
  check-tag:
    name: Check Image Tag Existence
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.check-tag.outputs.skip_build }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token }}
      - name: Check if image tag already exists in GHCR
        id: check-tag
        run: |
          IMAGE_TAG="${{ inputs.aseprite-git-ref }}-headless"
          IMAGE_URI="ghcr.io/${{ github.repository_owner }}/aseprite:${IMAGE_TAG}"
          echo "Inspecting registry for ${IMAGE_URI}..."
          
          if [ "${{ inputs.force-rebuild }}" = "true" ]; then
            echo "force-rebuild is enabled. Proceeding with build."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.aseprite-git-ref }}" = "main" ]; then
            echo "Git ref is 'main' (nightly). Proceeding with build."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          else
            if docker manifest inspect "${IMAGE_URI}" > /dev/null 2>&1; then
              echo "Tag ${IMAGE_TAG} already exists in GHCR. Skipping compilation to conserve runner quota."
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag ${IMAGE_TAG} does not exist in GHCR. Proceeding with compilation."
              echo "skip_build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-and-push:
    name: Build ${{ matrix.platform }} on ${{ matrix.runner }}
    needs: check-tag
    if: needs.check-tag.outputs.skip_build != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token }}

      - uses: docker/bake-action@v7
        with:
          pull: true
          push: true
          source: .
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=${{ matrix.arch }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.arch }}
        env:
          ASEPRITE_BUILD_TYPE: ${{ inputs.aseprite-build-type }}
          ASEPRITE_GIT_REF: ${{ inputs.aseprite-git-ref }}
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/
          IMAGE_TAG: ${{ inputs.aseprite-git-ref }}-headless-${{ matrix.arch }}

  merge-manifests:
    name: Merge Manifests and Publish Multi-Arch Image
    needs: [check-tag, build-and-push]
    if: needs.check-tag.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token }}

      - name: Create and Push Multi-Arch Manifest
        run: |
          TAG="${{ inputs.aseprite-git-ref }}-headless"
          PREFIX="ghcr.io/${{ github.repository_owner }}/aseprite:"
          docker buildx imagetools create -t "${PREFIX}${TAG}" \
            "${PREFIX}${TAG}-amd64" \
            "${PREFIX}${TAG}-arm64"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/aseprite:${{ inputs.aseprite-git-ref }}-headless
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL'

      - name: Trigger Downstream GDTK Build
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.dispatch-pat || secrets.ghcr-token }}
          repository: ${{ github.repository_owner }}/docker-game-development-toolkit
          event-type: aseprite-published
          client-payload: '{"aseprite_git_ref": "${{ inputs.aseprite-git-ref }}"}'
