name: Base

on:
  workflow_call: 
    inputs: 
      aseprite-git-ref:
        required: false
        type: string
        description: The desired Aseprite git ref to build from.
        default: main
      aseprite-build-type:
        required: false
        type: string
        description: Usually one of 'Debug', 'Release', or 'RelWithDebInfo'.
        default: Release
      force-rebuild:
        required: false
        type: boolean
        description: Force rebuild even if image tag exists in GHCR.
        default: false

    secrets:
      ghcr-token:
        required: true
        description: Access token to the GitHub Container Registry associated with the repository owner.

permissions:
  contents: read
  packages: write

jobs:
  check-tag:
    name: Check Image Tag Existence
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.check-tag.outputs.skip_build }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token }}
      - name: Check if image tag already exists in GHCR
        id: check-tag
        env:
          ASEPRITE_GIT_REF: ${{ inputs.aseprite-git-ref }}
          FORCE_REBUILD: ${{ inputs.force-rebuild }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if ! [[ "$ASEPRITE_GIT_REF" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Error: aseprite-git-ref '$ASEPRITE_GIT_REF' contains invalid OCI tag characters (allowed: A-Za-z0-9._-)." >&2
            exit 1
          fi

          IMAGE_TAG="${ASEPRITE_GIT_REF}-headless"
          IMAGE_URI="ghcr.io/${REPOSITORY_OWNER}/aseprite:${IMAGE_TAG}"
          echo "Inspecting registry for ${IMAGE_URI}..."

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "force-rebuild is enabled. Proceeding with build."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          elif [ "$ASEPRITE_GIT_REF" = "main" ]; then
            echo "Git ref is 'main' (nightly). Proceeding with build."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          else
            if docker manifest inspect "${IMAGE_URI}" > /dev/null 2>&1; then
              echo "Tag ${IMAGE_TAG} already exists in GHCR. Skipping compilation to conserve runner quota."
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag ${IMAGE_TAG} does not exist in GHCR. Proceeding with compilation."
              echo "skip_build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-and-push:
    name: Build ${{ matrix.platform }} on ${{ matrix.runner }}
    needs: check-tag
    if: needs.check-tag.outputs.skip_build != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v7
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Trust decision: mirror.gcr.io is Google's official pull-through cache for docker.io,
          # mitigating anonymous Docker Hub pull rate limits on GitHub-hosted runners.
          # Base images track ubuntu:26.04 by tag for upstream security fixes and are Trivy-scanned.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Cache ccache (${{ matrix.arch }})
        if: inputs.aseprite-git-ref == 'main' && github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-${{ matrix.arch }}
          key: ccache-${{ matrix.arch }}-main-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-main-
      - name: Restore ccache (${{ matrix.arch }})
        if: inputs.aseprite-git-ref != 'main' || github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-${{ matrix.arch }}
          key: ccache-${{ matrix.arch }}-${{ inputs.aseprite-git-ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ inputs.aseprite-git-ref }}-
      - name: Restore and Persist BuildKit ccache Mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          skip-extraction: ${{ inputs.aseprite-git-ref != 'main' || github.ref != 'refs/heads/main' }}
          cache-map: |
            {
              "${{ runner.temp }}/ccache-${{ matrix.arch }}": {
                "target": "/root/.ccache",
                "id": "ccache-${{ matrix.arch }}"
              }
            }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token }}

      - name: Bake and push
        uses: docker/bake-action@v7
        with:
          pull: true
          push: true
          source: .
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=${{ matrix.arch }}
            ${{ inputs.aseprite-git-ref == 'main' && github.ref == 'refs/heads/main' && format('*.cache-to=type=gha,mode=max,scope={0}', matrix.arch) || '' }}
        env:
          ASEPRITE_BUILD_TYPE: ${{ inputs.aseprite-build-type }}
          ASEPRITE_GIT_REF: ${{ inputs.aseprite-git-ref }}
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/
          IMAGE_TAG: ${{ inputs.aseprite-git-ref }}-headless-${{ matrix.arch }}

  merge-manifests:
    name: Merge Manifests and Publish Multi-Arch Image
    needs: [check-tag, build-and-push]
    if: needs.check-tag.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token }}

      - name: Create and Push Multi-Arch Manifest
        env:
          ASEPRITE_GIT_REF: ${{ inputs.aseprite-git-ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          TAG="${ASEPRITE_GIT_REF}-headless"
          PREFIX="ghcr.io/${REPOSITORY_OWNER}/aseprite:"
          docker buildx imagetools create -t "${PREFIX}${TAG}" \
            "${PREFIX}${TAG}-amd64" \
            "${PREFIX}${TAG}-arm64"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/aseprite:${{ inputs.aseprite-git-ref }}-headless
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: '.trivyignore'
          severity: 'CRITICAL'

  prune-ccache:
    name: Prune Older Nightly Caches
    needs: [check-tag, build-and-push]
    if: always() && needs.check-tag.outputs.skip_build != 'true' && inputs.aseprite-git-ref == 'main' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep newest main ccache entry per arch and bound BuildKit GHA cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          failed=0

          for arch in amd64 arm64; do
            prefix="ccache-${arch}-main-"
            if ! response=$(gh api --paginate --slurp \
              "/repos/${REPO}/actions/caches?ref=refs/heads/main&key=${prefix}&sort=created_at&direction=desc&per_page=100"); then
              echo "::warning::Failed to list ccache entries for ${prefix}"
              failed=1
              continue
            fi
            if ! ids=$(printf '%s\n' "$response" | jq -r '[.[].actions_caches[]] | sort_by(.created_at) | reverse | .[1:][].id'); then
              echo "::warning::Failed to parse ccache entries for ${prefix}"
              failed=1
              continue
            fi
            for id in $ids; do
              echo "Pruning older ccache entry ${id} (${prefix})..."
              if ! gh api -X DELETE "/repos/${REPO}/actions/caches/${id}"; then
                echo "::warning::Failed to delete ccache entry ${id} (${prefix})"
                failed=1
              fi
            done
          done

          # Prune older BuildKit type=gha cache entries (index- and buildkit-blob-) on main beyond a 5 GiB LRU budget
          # so combined ccache (<= 4 GiB) + BuildKit caches stay under GitHub's 10 GiB repo cap.
          if ! gha_response=$(gh api --paginate --slurp \
            "/repos/${REPO}/actions/caches?ref=refs/heads/main&sort=last_accessed_at&direction=desc&per_page=100"); then
            echo "::warning::Failed to list BuildKit GHA cache entries for refs/heads/main"
            failed=1
          elif ! stale_gha_ids=$(printf '%s\n' "$gha_response" | jq -r '
            [.[].actions_caches[] | select((.key // "") | (startswith("buildkit-blob-") or startswith("index-")))]
            | sort_by(.last_accessed_at // .created_at) | reverse
            | reduce .[] as $item (
                {acc: 0, full: false, drop: []};
                if .full or ((.acc + ($item.size_in_bytes // 0)) > 5368709120) then
                  .full = true | .drop += [$item.id]
                else
                  .acc += ($item.size_in_bytes // 0)
                end
              )
            | .drop[]
          '); then
            echo "::warning::Failed to parse BuildKit GHA cache entries for refs/heads/main"
            failed=1
          else
            for id in $stale_gha_ids; do
              echo "Pruning older BuildKit GHA cache entry ${id}..."
              if ! gh api -X DELETE "/repos/${REPO}/actions/caches/${id}"; then
                echo "::warning::Failed to delete BuildKit GHA cache entry ${id}"
                failed=1
              fi
            done
          fi

          exit "$failed"
