version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Canada/Pacific
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Canada/Pacific
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker:
        patterns:
          - '*'
